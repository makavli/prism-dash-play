import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#070610"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "prismdash"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/prismdash
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("prismdash.apk?v=062cb83494", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("prismdash.tar.gz?v=97a4f3491f", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "Ready to start ! Please click/touch page"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script>
    (function () {
        var Real = window.AudioContext || window.webkitAudioContext;
        if (!Real) return;
        var contexts = [];
        function Tracked(options) {
            var context = new Real(options);
            contexts.push(context);
            if (document.hidden) context.suspend();
            return context;
        }
        Tracked.prototype = Real.prototype;
        window.AudioContext = Tracked;
        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
        document.addEventListener("visibilitychange", function () {
            contexts.forEach(function (context) {
                (document.hidden ? context.suspend() : context.resume()).catch(function () {});
            });
        });
    })();
    </script>
    <script>
    (function () {
        var FILES = {"boss": {"m4a": "music/boss.m4a?v=84a5cdd19c", "ogg": "music/boss.ogg?v=dccd203505"}, "menu": {"m4a": "music/menu.m4a?v=c596008ead", "ogg": "music/menu.ogg?v=8041fff636"}, "play": {"m4a": "music/play.m4a?v=8f5ebd2477", "ogg": "music/play.ogg?v=07a2c6486c"}};
        var SFX = {"achievement": "sfx/achievement.wav?v=24ee45d86a", "boss_die": "sfx/boss_die.wav?v=dc4de9ef2c", "boss_hit": "sfx/boss_hit.wav?v=40afb9b506", "clang": "sfx/clang.wav?v=483f789d5f", "dash": "sfx/dash.wav?v=d00faa5620", "gameover": "sfx/gameover.wav?v=779d605b5f", "hit": "sfx/hit.wav?v=9c5d6909b3", "kill0": "sfx/kill0.wav?v=f6aba8f20e", "kill1": "sfx/kill1.wav?v=d3101e0fa2", "kill10": "sfx/kill10.wav?v=964485e8de", "kill11": "sfx/kill11.wav?v=eb0fe74900", "kill2": "sfx/kill2.wav?v=f628b08392", "kill3": "sfx/kill3.wav?v=f2b4186cb4", "kill4": "sfx/kill4.wav?v=1ead88acd0", "kill5": "sfx/kill5.wav?v=aa7a77e71f", "kill6": "sfx/kill6.wav?v=f3e0c99c84", "kill7": "sfx/kill7.wav?v=745a50144e", "kill8": "sfx/kill8.wav?v=7308064b76", "kill9": "sfx/kill9.wav?v=bcc0aa5877", "milestone": "sfx/milestone.wav?v=577d70ea01", "nova": "sfx/nova.wav?v=40bbe57df2", "power": "sfx/power.wav?v=48bba76bea", "ready": "sfx/ready.wav?v=5bfa1c3555", "select": "sfx/select.wav?v=25bb6bd0b4", "shoot": "sfx/shoot.wav?v=e4dbb844b2", "spawn": "sfx/spawn.wav?v=fdd5a8f653", "wave": "sfx/wave.wav?v=0b74245f26"};
        var effects = {}, effectsLoading = false;
        var probe = document.createElement("audio");
        var ext = probe.canPlayType('audio/ogg; codecs="vorbis"') ? "ogg" : "m4a";
        var ctx = null, master = null, buffers = {}, loading = {}, current = null, wanted = null, muted = false;
        function context() {
            if (!ctx) {
                var AC = window.AudioContext || window.webkitAudioContext;
                ctx = new AC();
                master = ctx.createGain();
                master.gain.value = muted ? 0 : 1;
                master.connect(ctx.destination);
            }
            return ctx;
        }
        function load(mood) {
            if (buffers[mood] || loading[mood] || !FILES[mood]) return;
            loading[mood] = fetch(FILES[mood][ext])
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                .then(function (data) { return new Promise(function (ok, bad) { context().decodeAudioData(data, ok, bad); }); })
                .then(function (buffer) { buffers[mood] = buffer; start(); })
                .catch(function (e) { console.warn("music", mood, e); });
        }
        function start() {
            var w = wanted;
            if (!w || !buffers[w.mood]) return;
            var c = context(), now = c.currentTime, fade = w.fade / 1000;
            if (current && current.mood === w.mood) {
                current.gain.gain.setTargetAtTime(w.volume, now, 0.3);
                return;
            }
            if (current) {
                var old = current, g0 = old.gain.gain;
                g0.cancelScheduledValues(now);
                g0.setValueAtTime(g0.value, now);
                g0.linearRampToValueAtTime(0, now + fade);
                old.source.stop(now + fade + 0.1);
            }
            var source = c.createBufferSource();
            source.buffer = buffers[w.mood];
            source.loop = true;
            var gain = c.createGain();
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(w.volume, now + (current ? fade : 0.8));
            source.connect(gain);
            gain.connect(master);
            source.start(now);
            current = {mood: w.mood, source: source, gain: gain};
        }
        function loadEffects() {
            if (effectsLoading) return;
            effectsLoading = true;
            Object.keys(SFX).forEach(function (name) {
                fetch(SFX[name])
                    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                    .then(function (data) { return new Promise(function (ok, bad) { context().decodeAudioData(data, ok, bad); }); })
                    .then(function (buffer) { effects[name] = buffer; })
                    .catch(function (e) { console.warn("sfx", name, e); });
            });
        }
        window.prismMusic = {
            sfx: function (name, volume) {
                loadEffects();
                var buffer = effects[String(name)];
                if (!buffer || muted || !ctx || ctx.state !== "running") return;
                var source = ctx.createBufferSource();
                source.buffer = buffer;
                var gain = ctx.createGain();
                gain.gain.value = Number(volume);
                source.connect(gain);
                gain.connect(master);
                source.start();
            },
            mood: function (mood, volume, fadeMs) {
                loadEffects();
                wanted = {mood: String(mood), volume: Number(volume), fade: Number(fadeMs)};
                for (var name in FILES) load(name);
                start();
            },
            mute: function (on) {
                muted = !!on;
                if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.05);
            }
        };
        function unlock() {
            if (ctx && ctx.state === "suspended" && !document.hidden) ctx.resume().catch(function () {});
        }
        ["pointerdown", "keydown", "touchstart"].forEach(function (e) { window.addEventListener(e, unlock, true); });
    })();
    </script>
